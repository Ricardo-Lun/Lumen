<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel administrativo | LUMEN</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="src/css/styles.css">
</head>

<body class="auth-pending">

    <main class="container py-5">
        <header class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
            <div>
                <h1 class="mb-1">Panel administrativo</h1>
                <p class="text-muted mb-0">
                    Administración de usuarios de LUMEN
                </p>
            </div>

            <button type="button" id="logoutButton" class="btn btn-outline-danger">
                <i class="bi bi-box-arrow-right me-1"></i>
                Cerrar sesión
            </button>
        </header>

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
                    <div>
                        <h2 class="h5 mb-1">Usuarios registrados</h2>
                        <p class="text-muted mb-0">
                            Consulta las cuentas y sus datos de contacto.
                        </p>
                    </div>

                    <span class="badge text-bg-primary fs-6" id="userCount">
                        0 usuarios
                    </span>
                </div>

                <div class="mt-4">
                    <label for="userSearch" class="form-label">
                        Buscar usuario
                    </label>

                    <input type="search" id="userSearch" class="form-control"
                        placeholder="Nombre, usuario o correo electrónico">
                </div>
            </div>
        </div>

        <div id="adminFeedback" class="alert alert-danger d-none" role="alert" aria-live="polite"></div>

        <div class="card shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th scope="col">ID</th>
                            <th scope="col">Nombre completo</th>
                            <th scope="col">Usuario</th>
                            <th scope="col">Correo electrónico</th>
                            <th scope="col">Teléfono</th>
                            <th scope="col">Rol</th>
                            <th scope="col">Registro</th>
                        </tr>
                    </thead>

                    <tbody id="usersTableBody">
                        <tr>
                            <td colspan="7" class="text-center py-4 text-muted">
                                Cargando usuarios...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script type="module" src="/src/js/pages/admin.js"></script>
</body>

</html>
