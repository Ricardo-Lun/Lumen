<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi perfil | LUMEN</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="src/css/styles.css">
</head>

<body class="auth-pending">

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">

                <header class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
                    <div>
                        <h1 class="mb-1">¡Bienvenido a LUMEN!</h1>
                        <p class="text-muted mb-0">Mi perfil</p>
                    </div>

                    <button type="button" id="logoutButton" class="btn btn-outline-danger">
                        <i class="bi bi-box-arrow-right me-1"></i>
                        Cerrar sesión
                    </button>
                </header>

                <div id="profileFeedback" class="alert d-none" role="alert" aria-live="polite"></div>

                <section class="card shadow-sm">
                    <div class="card-header bg-transparent py-3">
                        <h2 class="h5 mb-0">
                            <i class="bi bi-person-circle me-2"></i>
                            Datos personales
                        </h2>
                    </div>

                    <div class="card-body">
                        <form id="profileForm">
                            <div class="mb-3">
                                <label for="profileFullName" class="form-label">
                                    Nombre completo
                                </label>
                                <input type="text" class="form-control" id="profileFullName" name="full_name"
                                    maxlength="100" required>
                            </div>

                            <div class="mb-3">
                                <label for="profileUsername" class="form-label">
                                    Nombre de usuario
                                </label>
                                <input type="text" class="form-control" id="profileUsername" name="username"
                                    maxlength="50" required>
                            </div>

                            <div class="mb-3">
                                <label for="profileEmail" class="form-label">
                                    Correo electrónico
                                </label>
                                <input type="email" class="form-control" id="profileEmail" name="email" maxlength="254"
                                    required>
                            </div>

                            <div class="mb-4">
                                <label for="profilePhone" class="form-label">
                                    Teléfono
                                </label>
                                <input type="tel" class="form-control" id="profilePhone" name="phone" maxlength="20"
                                    required>
                            </div>

                            <button type="submit" id="saveProfileButton" class="btn btn-primary">
                                <i class="bi bi-floppy me-1"></i>
                                Guardar cambios
                            </button>
                        </form>
                    </div>
                </section>

            </div>
        </div>
    </main>

    <script type="module" src="/src/js/pages/profile.js"></script>
</body>

</html>
